name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'source/optimizer-source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q source/optimizer-source.zip -d build-src
          test -f build-src/optimizer/settings.gradle.kts

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run unit tests
        working-directory: build-src/optimizer
        run: gradle clean testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: build-src/optimizer
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-debug-apk
          path: build-src/optimizer/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
